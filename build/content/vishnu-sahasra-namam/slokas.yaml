title:
  శ్రీ విష్ణు సహస్రనామ స్తోత్రం

poorvangam:
  start-line:
    హరిః ఓమ్
    శ్రీ విష్ణు సహస్రనామ స్తోత్రం
    పూర్వాంగం
  1:
    శుక్లాంబరధరం విష్ణుం శశివర్ణం చతుర్భుజమ్ |\n
    ప్రసన్నవదనం ధ్యాయేత్ సర్వవిఘ్నోపశాంతయే || ౧ ||
  2:
    యస్య ద్విరదవక్త్రాద్యాః పారిషద్యాః పరశ్శతమ్ |\n
    విఘ్నం నిఘ్నన్తి సతతం విష్వక్సేనం తమాశ్రయే || ౨ ||
  3:
    వ్యాసం వసిష్ఠనప్తారం శక్తేః పౌత్రమకల్మషమ్ |\n
    పరాశరాత్మజం వందే శుకతాతం తపోనిధిమ్ || ౩ ||
  4:
    వ్యాసాయ విష్ణురూపాయ వ్యాసరూపాయ విష్ణవే |\n
    నమో వై బ్రహ్మనిధయే వాసిష్ఠాయ నమో నమః || ౪ ||
  5:
    అవికారాయ శుద్ధాయ నిత్యాయ పరమాత్మనే |\n
    సదైకరూపరూపాయ విష్ణవే సర్వజిష్ణవే || ౫ ||
  6:
    యస్య స్మరణమాత్రేణ జన్మసంసారబంధనాత్ |\n
    విముచ్యతే నమస్తస్మై విష్ణవే ప్రభవిష్ణవే || ౬ ||\n
    ఓం నమో విష్ణవే ప్రభవిష్ణవే |
  7:
    శ్రీవైశంపాయన ఉవాచ |\n
    శ్రుత్వా ధర్మానశేషేణ పావనాని చ సర్వశః |\n
    యుధిష్ఠిరః శాంతనవం పునరేవాభ్యభాషత || ౭ ||
  8:
    యుధిష్ఠిర ఉవాచ |\n
    కిమేకం దైవతం లోకే కిం వాప్యేకం పరాయణమ్ |\n
    స్తువన్తః కం కమర్చన్తః ప్రాప్నుయుర్మానవాః శుభమ్ || ౮ ||
  9:
    కో ధర్మః సర్వధర్మాణాం భవతః పరమో మతః |\n
    కిం జపన్ముచ్యతే జన్తుర్జన్మసంసారబంధనాత్ || ౯ ||
  10:
    శ్రీ భీష్మ ఉవాచ |\n
    జగత్ప్రభుం దేవదేవమనన్తం పురుషోత్తమమ్ |\n
    స్తువన్నామసహస్రేణ పురుషః సతతోత్థితః || ౧౦ ||
  11:
    తమేవ చార్చయన్నిత్యం భక్త్యా పురుషమవ్యయమ్ |\n
    ధ్యాయన్ స్తువన్నమస్యంశ్చ యజమానస్తమేవ చ || ౧౧ ||
  12:
    అనాదినిధనం విష్ణుం సర్వలోకమహేశ్వరమ్ |\n
    లోకాధ్యక్షం స్తువన్నిత్యం సర్వదుఃఖాతిగో భవేత్ || ౧౨ ||
  13:
    బ్రహ్మణ్యం సర్వధర్మజ్ఞం లోకానాం కీర్తివర్ధనమ్ |\n
    లోకనాథం మహద్భూతం సర్వభూతభవోద్భవమ్ || ౧౩ ||
  14:
    ఏష మే సర్వధర్మాణాం ధర్మోఽధికతమో మతః |\n
    యద్భక్త్యా పుండరీకాక్షం స్తవైరర్చేన్నరః సదా || ౧౪ ||
  15:
    పరమం యో మహత్తేజః పరమం యో మహత్తపః |\n
    పరమం యో మహద్బ్రహ్మ పరమం యః పరాయణమ్ || ౧౫ ||
  16:
    పవిత్రాణాం పవిత్రం యో మంగళానాం చ మంగళమ్ |\n
    దైవతం దైవతానాం చ భూతానాం యోఽవ్యయః పితా || ౧౬ ||
  17:
    యతః సర్వాణి భూతాని భవన్త్యాదియుగాగమే |\n
    యస్మింశ్చ ప్రలయం యాన్తి పునరేవ యుగక్షయే || ౧౭ ||
  18:
    తస్య లోకప్రధానస్య జగన్నాథస్య భూపతే |\n
    విష్ణోర్నామసహస్రం మే శృణు పాపభయాపహమ్ || ౧౮ ||
  19:
    యాని నామాని గౌణాని విఖ్యాతాని మహాత్మనః |\n
    ఋషిభిః పరిగీతాని తాని వక్ష్యామి భూతయే || ౧౯ ||
  20:
    ఋషిర్నామ్నాం సహస్రస్య వేదవ్యాసో మహామునిః |\n
    ఛన్దోఽనుష్టుప్ తథా దేవో భగవాన్ దేవకీసుతః || ౨౦ ||
  21:
    అమృతాంశూద్భవో బీజం శక్తిర్దేవకినందనః |\n
    త్రిసామా హృదయం తస్య శాంత్యర్థే వినియుజ్యతే || ౨౧ ||
  22:
    విష్ణుం జిష్ణుం మహావిష్ణుం ప్రభవిష్ణుం మహేశ్వరమ్ |\n
    అనేకరూప దైత్యాన్తం నమామి పురుషోత్తమమ్ || ౨౨ ||

poorvanyasaha:
  \n
  అస్య శ్రీవిష్ణోర్దివ్యసహస్రనామస్తోత్ర మహామంత్రస్య |\n
  శ్రీ వేదవ్యాసో భగవానృషిః| అనుష్టుప్ ఛన్దః|\n
  శ్రీమహావిష్ణుః పరమాత్మా శ్రీమన్నారాయణో దేవతా|\n
  అమృతాంశూద్భవో భానురితి బీజమ్..| దేవకీనందనః స్రష్టేతి శక్తిః|\n
  ఉద్భవః క్షోభణో దేవ ఇతి పరమో మంత్రః|\n
  శంఖభృన్నందకీ చక్రీతి కీలకమ్..| శార్‍ఙ్గధన్వా గదాధర ఇత్యస్త్రమ్..|\n
  రథాఙ్గపాణిరక్షోభ్య ఇతి నేత్రమ్..| త్రిసామా సామగస్సామేతి కవచమ్..|\n
  ఆనందం పరబ్రహ్మేతి యోనిః|\n
  ఋతుస్సుదర్శనః కాల ఇతి దిగ్బంధః| శ్రీ విశ్వరూప ఇతి ధ్యానమ్..|\n
  శ్రీమహావిష్ణు ప్రీత్యర్థే సహస్రనామ జపే వినియోగః ||\n

dhyaanam:
  start-line:
    ధ్యానమ్ |
  1:
    క్షీరోదన్వత్ప్రదేశే శుచిమణివిలసత్సైకతే మౌక్తికానాం\n
    మాలాక్లుప్తాసనస్థః స్ఫటికమణినిభైర్మౌక్తికైర్మండితాంగః |\n
    శుభ్రైరభ్రైరదభ్రైరుపరివిరచితైర్ముక్తపీయూషవర్షై-\n
    -రానందీ నః పునీయాదరినళినగదాశంఖపాణిర్ముకుందః || ౧ ||
  2:
    భూః పాదౌ యస్య నాభిర్వియదసురనిలశ్చంద్ర సూర్యౌ చ నేత్రే\n
    కర్ణావాసాః శిరో ద్యౌర్ముఖమపి దహనో యస్య వాస్తేయమబ్ధిః |\n
    అంతఃస్థం యస్య విశ్వం సురనరఖగగోభోగిగంధర్వదైత్యైః\n
    చిత్రం రంరమ్యతే తం త్రిభువనవపుషం విష్ణుమీశం నమామి || ౨ ||
  3:
    శాంతాకారం భుజగశయనం పద్మనాభం సురేశం\n
    విశ్వాకారం గగనసదృశం మేఘవర్ణం శుభాంగమ్ |\n
    లక్ష్మీకాంతం కమలనయనం యోగిహృద్ధ్యానగమ్యం\n
    వందే విష్ణుం భవభయహరం సర్వలోకైకనాథమ్ || ౩ ||
  4:
    మేఘశ్యామం పీతకౌశేయవాసం\n
    శ్రీవత్సాంకం కౌస్తుభోద్భాసితాంగమ్ |\n
    పుణ్యోపేతం పుండరీకాయతాక్షం\n
    విష్ణుం వందే సర్వలోకైకనాథమ్ || ౪ ||
  5:
    నమః సమస్తభూతానామాదిభూతాయ భూభృతే |\n
    అనేకరూపరూపాయ విష్ణవే ప్రభవిష్ణవే || ౫ ||
  6:
    సశంఖచక్రం సకిరీటకుండలం\n
    సపీతవస్త్రం సరసీరుహేక్షణమ్ |\n
    సహారవక్షఃస్థలశోభికౌస్తుభం\n
    నమామి విష్ణుం శిరసా చతుర్భుజమ్ || ౬ ||
  7:
    ఛాయాయాం పారిజాతస్య హేమసింహాసనోపరి\n
    ఆసీనమంబుదశ్యామమాయతాక్షమలంకృతమ్ |\n
    చంద్రాననం చతుర్బాహుం శ్రీవత్సాంకిత వక్షసం\n
    రుక్మిణీ సత్యభామాభ్యాం సహితం కృష్ణమాశ్రయే || ౭ ||

maha-mantram:
  start-line:
    హరిః ఓం - ఓమ్ విశ్వస్మై నమః (మహామంత్రం)
  1:
    విశ్వం విష్ణుర్వషట్కారో భూతభవ్యభవత్ప్రభుః |\n
    భూతకృద్భూతభృద్భావో భూతాత్మా భూతభావనః || ౧ ||
  2:
    పూతాత్మా పరమాత్మా చ ముక్తానాం పరమాగతిః |\n
    అవ్యయః పురుషస్సాక్షీ క్షేత్రజ్ఞోఽక్షర ఏవ చ || ౨ ||
  3:
    యోగో యోగవిదాం నేతా ప్రధానపురుషేశ్వరః |\n
    నారసింహవపుః శ్రీమాన్ కేశవః పురుషోత్తమః || ౩ ||
  4:
    సర్వశ్శర్వశ్శివస్స్థాణుర్భూతాదిర్నిధిరవ్యయః |\n
    సంభవో భావనో భర్తా ప్రభవః ప్రభురీశ్వరః || ౪ ||
  5:
    స్వయంభూశ్శంభురాదిత్యః పుష్కరాక్షో మహాస్వనః |\n
    అనాదినిధనో ధాతా విధాతా ధాతురుత్తమః || ౫ ||
  6:
    అప్రమేయో హృషీకేశః పద్మనాభోఽమరప్రభుః |\n
    విశ్వకర్మా మనుస్త్వష్టా స్థవిష్ఠః స్థవిరో ధ్రువః || ౬ ||
  7:
    అగ్రాహ్యశ్శాశ్వతః కృష్ణో లోహితాక్షః ప్రతర్దనః |\n
    ప్రభూతస్త్రికకుబ్ధామ పవిత్రం మంగళం పరమ్ || ౭ ||
  8:
    ఈశానః ప్రాణదః ప్రాణో జ్యేష్ఠః శ్రేష్ఠః ప్రజాపతిః |\n
    హిరణ్యగర్భో భూగర్భో మాధవో మధుసూదనః || ౮ ||
  9:
    ఈశ్వరో విక్రమీ ధన్వీ మేధావీ విక్రమః క్రమః |\n
    అనుత్తమో దురాధర్షః కృతజ్ఞః కృతిరాత్మవాన్ || ౯ ||
  10:
    సురేశశ్శరణం శర్మ విశ్వరేతాః ప్రజాభవః |\n
    అహస్సంవత్సరో వ్యాలః ప్రత్యయస్సర్వదర్శనః || ౧౦ ||
  11:
    అజస్సర్వేశ్వరస్సిద్ధస్సిద్ధిస్సర్వాదిరచ్యుతః |\n
    వృషాకపిరమేయాత్మా సర్వయోగవినిస్సృతః || ౧౧ ||
  12:
    వసుర్వసుమనాస్సత్యస్సమాత్మా సమ్మితస్సమః |\n
    అమోఘః పుండరీకాక్షో వృషకర్మా వృషాకృతిః || ౧౨ ||
  13:
    రుద్రో బహుశిరా బభ్రుర్విశ్వయోనిశ్శుచిశ్రవాః |\n
    అమృతశ్శాశ్వతస్స్థాణుర్వరారోహో మహాతపాః || ౧౩ ||
  14:
    సర్వగస్సర్వవిద్భానుర్విష్వక్సేనో జనార్దనః |\n
    వేదో వేదవిదవ్యంగో వేదాంగో వేదవిత్కవిః || ౧౪ ||
  15:
    లోకాధ్యక్షస్సురాధ్యక్షో ధర్మాధ్యక్షః కృతాకృతః |\n
    చతురాత్మా చతుర్వ్యూహశ్చతుర్దంష్ట్రశ్చతుర్భుజః || ౧౫ ||
  16:
    భ్రాజిష్ణుర్భోజనం భోక్తా సహిష్ణుర్జగదాదిజః |\n
    అనఘో విజయో జేతా విశ్వయోనిః పునర్వసుః || ౧౬ ||
  17:
    ఉపేన్ద్రో వామనః ప్రాంశురమోఘశ్శుచిరూర్జితః |\n
    అతీన్ద్రస్సంగ్రహస్సర్గో ధృతాత్మా నియమో యమః || ౧౭ ||
  18:
    వేద్యో వైద్యస్సదాయోగీ వీరహా మాధవో మధుః |\n
    అతీన్ద్రియో మహామాయో మహోత్సాహో మహాబలః || ౧౮ ||
  19:
    మహాబుద్ధిర్మహావీర్యో మహాశక్తిర్మహాద్యుతిః |\n
    అనిర్దేశ్యవపుః శ్రీమానమేయాత్మా మహాద్రిధృత్ || ౧౯ ||
  20:
    మహేష్వాసో మహీభర్తా శ్రీనివాసస్సతాం‍గతిః |\n
    అనిరుద్ధస్సురానందో గోవిందో గోవిదాం‍పతిః || ౨౦ ||
  21:
    మరీచిర్దమనో హంసస్సుపర్ణో భుజగోత్తమః |\n
    హిరణ్యనాభస్సుతపాః పద్మనాభః ప్రజాపతిః || ౨౧ ||
  22:
    అమృత్యుస్సర్వదృక్సింహస్సంధాతా సంధిమాన్ స్థిరః |\n
    అజో దుర్మర్షణశ్శాస్తా విశ్రుతాత్మా సురారిహా || ౨౨ ||
  23:
    గురుర్గురుతమో ధామ సత్యస్సత్యపరాక్రమః |\n
    నిమిషోఽనిమిషస్స్రగ్వీ వాచస్పతిరుదారధీః || ౨౩ ||
  24:
    అగ్రణీర్గ్రామణీః శ్రీమాన్న్యాయో నేతా సమీరణః |\n
    సహస్రమూర్ధా విశ్వాత్మా సహస్రాక్షస్సహస్రపాత్ || ౨౪ ||
  25:
    ఆవర్తనో నివృత్తాత్మా సంవృతస్సంప్రమర్దనః |\n
    అహస్సంవర్తకో వహ్నిరనిలో ధరణీధరః || ౨౫ ||
  26:
    సుప్రసాదః ప్రసన్నాత్మా విశ్వసృడ్విశ్వభుగ్విభుః |\n
    సత్కర్తా సత్కృతస్సాధుర్జహ్నుర్నారాయణో నరః || ౨౬ ||
  27:
    అసంఖ్యేయోఽప్రమేయాత్మా విశిష్టశ్శిష్టకృచ్ఛుచిః |\n
    సిద్ధార్థస్సిద్ధసంకల్పస్సిద్ధిదస్సిద్ధిసాధనః || ౨౭ ||
  28:
    వృషాహీ వృషభో విష్ణుర్వృషపర్వా వృషోదరః |\n
    వర్ధనో వర్ధమానశ్చ వివిక్తః శ్రుతిసాగరః || ౨౮ ||
  29:
    సుభుజో దుర్ధరో వాగ్మీ మహేన్ద్రో వసుదో వసుః |\n
    నైకరూపో బృహద్రూపః శిపివిష్టః ప్రకాశనః || ౨౯ ||
  30:
    ఓజస్తేజో ద్యుతిధరః ప్రకాశాత్మా ప్రతాపనః |\n
    ఋద్ధస్స్పష్టాక్షరో మంత్రశ్చంద్రాంశుర్భాస్కరద్యుతిః || ౩౦ ||
  31:
    అమృతాంశూద్భవో భానుః శశబిందుస్సురేశ్వరః |\n
    ఔషధం జగతస్సేతుస్సత్యధర్మపరాక్రమః || ౩౧ ||
  32:
    భూతభవ్యభవన్నాథః పవనః పావనోఽనలః |\n
    కామహా కామకృత్కాన్తః కామః కామప్రదః ప్రభుః || ౩౨ ||
  33:
    యుగాదికృద్యుగావర్తో నైకమాయో మహాశనః |\n
    అదృశ్యో వ్యక్తరూపశ్చ సహస్రజిదనన్తజిత్ || ౩౩ ||
  34:
    ఇష్టోఽవిశిష్టశ్శిష్టేష్టః శిఖండీ నహుషో వృషః |\n
    క్రోధహా క్రోధకృత్కర్తా విశ్వబాహుర్మహీధరః || ౩౪ ||
  35:
    అచ్యుతః ప్రథితః ప్రాణః ప్రాణదో వాసవానుజః |\n
    అపాంనిధిరధిష్ఠానమప్రమత్తః ప్రతిష్ఠితః || ౩౫ ||
  36:
    స్కందః స్కందధరో ధుర్యో వరదో వాయువాహనః |\n
    వాసుదేవో బృహద్భానురాదిదేవః పురన్దరః || ౩౬ ||
  37:
    అశోకస్తారణస్తారః శూరశ్శౌరిర్జనేశ్వరః |\n
    అనుకూలశ్శతావర్తః పద్మీ పద్మనిభేక్షణః || ౩౭ ||
  38:
    పద్మనాభోఽరవిందాక్షః పద్మగర్భశ్శరీరభృత్ |\n
    మహర్ధిరృద్ధో వృద్ధాత్మా మహాక్షో గరుడధ్వజః || ౩౮ ||
  39:
    అతులశ్శరభో భీమస్సమయజ్ఞో హవిర్హరిః |\n
    సర్వలక్షణలక్షణ్యో లక్ష్మీవాన్ సమితింజయః || ౩౯ ||
  40:
    విక్షరో రోహితో మార్గో హేతుర్దామోదరస్సహః |\n
    మహీధరో మహాభాగో వేగవానమితాశనః || ౪౦ ||
  41:
    ఉద్భవః క్షోభణో దేవః శ్రీగర్భః పరమేశ్వరః |\n
    కరణం కారణం కర్తా వికర్తా గహనో గుహః || ౪౧ ||
  42:
    వ్యవసాయో వ్యవస్థానః సంస్థానః స్థానదో ధ్రువః |\n
    పరర్ధిః పరమస్పష్టస్తుష్టః పుష్టశ్శుభేక్షణః || ౪౨ ||
  43:
    రామో విరామో విరజో మార్గో నేయో నయోఽనయః |\n
    వీరశ్శక్తిమతాం శ్రేష్ఠో ధర్మో ధర్మవిదుత్తమః || ౪౩ ||
  44:
    వైకుంఠః పురుషః ప్రాణః ప్రాణదః ప్రణవః పృథుః |\n
    హిరణ్యగర్భశ్శత్రుఘ్నో వ్యాప్తో వాయురధోక్షజః || ౪౪ ||
  45:
    ఋతుస్సుదర్శనః కాలః పరమేష్ఠీ పరిగ్రహః |\n
    ఉగ్రస్సంవత్సరో దక్షో విశ్రామో విశ్వదక్షిణః || ౪౫ ||
  46:
    విస్తారస్స్థావరస్థాణుః ప్రమాణం బీజమవ్యయమ్ |\n
    అర్థోఽనర్థో మహాకోశో మహాభోగో మహాధనః || ౪౬ ||
  47:
    అనిర్విణ్ణస్స్థవిష్ఠో భూర్ధర్మయూపో మహామఖః |\n
    నక్షత్రనేమిర్నక్షత్రీ క్షమః క్షామస్సమీహనః || ౪౭ ||
  48:
    యజ్ఞ ఇజ్యో మహేజ్యశ్చ క్రతుస్సత్రం సతాం‍గతిః |\n
    సర్వదర్శీ విముక్తాత్మా సర్వజ్ఞో జ్ఞానముత్తమమ్ || ౪౮ ||
  49:
    సువ్రతస్సుముఖస్సూక్ష్మః సుఘోషస్సుఖదస్సుహృత్ |\n
    మనోహరో జితక్రోధో వీరబాహుర్విదారణః || ౪౯ ||
  50:
    స్వాపనస్స్వవశో వ్యాపీ నైకాత్మా నైకకర్మకృత్ |\n
    వత్సరో వత్సలో వత్సీ రత్నగర్భో ధనేశ్వరః || ౫౦ ||
  51:
    ధర్మగుబ్ధర్మకృద్ధర్మీ సదసత్క్షరమక్షరమ్ | \n
    అవిజ్ఞాతా సహస్రాం‍శుర్విధాతా కృతలక్షణః || ౫౧ ||\n
    [**సదక్షరమసత్క్షరమ్**]
  52:
    గభస్తినేమిస్సత్త్వస్థస్సింహో భూతమహేశ్వరః |\n
    ఆదిదేవో మహాదేవో దేవేశో దేవభృద్గురుః || ౫౨ ||
  53:
    ఉత్తరో గోపతిర్గోప్తా జ్ఞానగమ్యః పురాతనః |\n
    శరీరభూతభృద్భోక్తా కపీన్ద్రో భూరిదక్షిణః || ౫౩ ||
  54:
    సోమపోఽమృతపస్సోమః పురుజిత్పురుసత్తమః |\n
    వినయో జయస్సత్యసంధో దాశార్హస్సాత్త్వతాంపతిః || ౫౪ ||
  55:
    జీవో వినయితా సాక్షీ ముకుందోఽమితవిక్రమః |\n
    అంభోనిధిరనంతాత్మా మహోదధిశయోఽన్తకః || ౫౫ ||
  56:
    అజో మహార్హస్స్వాభావ్యో జితామిత్రః ప్రమోదనః |\n
    ఆనందో నందనో నందస్సత్యధర్మా త్రివిక్రమః || ౫౬ ||
  57:
    మహర్షిః కపిలాచార్యః కృతజ్ఞో మేదినీపతిః |\n
    త్రిపదస్త్రిదశాధ్యక్షో మహాశృంగః కృతాంతకృత్ || ౫౭ ||
  58:
    మహావరాహో గోవిందస్సుషేణః కనకాంగదీ |\n
    గుహ్యో గభీరో గహనో గుప్తశ్చక్రగదాధరః || ౫౮ ||
  59:
    వేధాస్స్వాంగోఽజితః కృష్ణో దృఢస్సంకర్షణోఽచ్యుతః |\n
    వరుణో వారుణో వృక్షః పుష్కరాక్షో మహామనాః || ౫౯ ||
  60:
    భగవాన్ భగహాఽఽనందీ వనమాలీ హలాయుధః |\n
    ఆదిత్యో జ్యోతిరాదిత్యస్సహిష్ణుర్గతిసత్తమః || ౬౦ ||
  61:
    సుధన్వా ఖండపరశుర్దారుణో ద్రవిణప్రదః |\n
    దివిస్పృక్సర్వదృగ్వ్యాసో వాచస్పతిరయోనిజః || ౬౧ ||
  62:
    త్రిసామా సామగస్సామ నిర్వాణం భేషజం భిషక్ |\n
    సన్న్యాసకృచ్ఛమశ్శాంతో నిష్ఠా శాంతిః పరాయణమ్ || ౬౨ ||
  63:
    శుభాంగశ్శాంతిదస్స్రష్టా కుముదః కువలేశయః |\n
    గోహితో గోపతిర్గోప్తా వృషభాక్షో వృషప్రియః || ౬౩ ||
  64:
    అనివర్తీ నివృత్తాత్మా సంక్షేప్తా క్షేమకృచ్ఛివః |\n
    శ్రీవత్సవక్షాః శ్రీవాసః శ్రీపతిః శ్రీమతాంవరః || ౬౪ ||
  65:
    శ్రీదః శ్రీశః శ్రీనివాసః శ్రీనిధిః శ్రీవిభావనః |\n
    శ్రీధరః శ్రీకరః శ్రేయః శ్రీమాన్ లోకత్రయాశ్రయః || ౬౫ ||
  66:
    స్వక్షస్స్వంగశ్శతానందో నందిర్జ్యోతిర్గణేశ్వరః |\n
    విజితాత్మా విధేయాత్మా సత్కీర్తిశ్ఛిన్నసంశయః || ౬౬ ||
  67:
    ఉదీర్ణస్సర్వతశ్చక్షురనీశశ్శాశ్వతస్థిరః |\n
    భూశయో భూషణో భూతిర్విశోకశ్శోకనాశనః || ౬౭ ||
  68:
    అర్చిష్మానర్చితః కుంభో విశుద్ధాత్మా విశోధనః |\n
    అనిరుద్ధోఽప్రతిరథః ప్రద్యుమ్నోఽమితవిక్రమః || ౬౮ ||
  69:
    కాలనేమినిహా వీరశ్శౌరిశ్శూరజనేశ్వరః |\n
    త్రిలోకాత్మా త్రిలోకేశః కేశవః కేశిహా హరిః || ౬౯ ||
  70:
    కామదేవః కామపాలః కామీ కాంతః కృతాగమః |\n
    అనిర్దేశ్యవపుర్విష్ణుర్వీరోఽనంతో ధనంజయః || ౭౦ ||
  71:
    బ్రహ్మణ్యో బ్రహ్మకృద్బ్రహ్మా బ్రహ్మ బ్రహ్మవివర్ధనః |\n
    బ్రహ్మవిద్బ్రాహ్మణో బ్రహ్మీ బ్రహ్మజ్ఞో బ్రాహ్మణప్రియః || ౭౧ ||
  72:
    మహాక్రమో మహాకర్మా మహాతేజా మహోరగః |\n
    మహాక్రతుర్మహాయజ్వా మహాయజ్ఞో మహాహవిః || ౭౨ ||
  73:
    స్తవ్యస్స్తవప్రియస్స్తోత్రం స్తుతిస్స్తోతా రణప్రియః |\n
    పూర్ణః పూరయితా పుణ్యః పుణ్యకీర్తిరనామయః || ౭౩ ||
  74:
    మనోజవస్తీర్థకరో వసురేతా వసుప్రదః |\n
    వసుప్రదో వాసుదేవో వసుర్వసుమనా హవిః || ౭౪ ||
  75:
    సద్గతిస్సత్కృతిస్సత్తా సద్భూతిస్సత్పరాయణః |\n
    శూరసేనో యదుశ్రేష్ఠస్సన్నివాసస్సుయామునః || ౭౫ ||
  76:
    భూతావాసో వాసుదేవః సర్వాసునిలయోఽనలః |\n
    దర్పహా దర్పదోఽదృప్తో దుర్ధరోఽథాపరాజితః || ౭౬ ||
  77:
    విశ్వమూర్తిర్మహామూర్తిర్దీప్తమూర్తిరమూర్తిమాన్ |\n
    అనేకమూర్తిరవ్యక్తశ్శతమూర్తిశ్శతాననః || ౭౭ ||
  78:
    ఏకో నైకస్స్తవః కః కిం యత్తత్పదమనుత్తమమ్ |\n
    లోకబంధుర్లోకనాథో మాధవో భక్తవత్సలః || ౭౮ ||
  79:
    సువర్ణవర్ణో హేమాంగో వరాంగశ్చందనాంగదీ |\n
    వీరహా విషమశ్శూన్యో ఘృతాశీరచలశ్చలః || ౭౯ ||
  80:
    అమానీ మానదో మాన్యో లోకస్వామీ త్రిలోకధృత్ |\n
    సుమేధా మేధజో ధన్యస్సత్యమేధా ధరాధరః || ౮౦ ||
  81:
    తేజోవృషో ద్యుతిధరస్సర్వశస్త్రభృతాం వరః |\n
    ప్రగ్రహో నిగ్రహో వ్యగ్రో నైకశృంగో గదాగ్రజః || ౮౧ ||
  82:
    చతుర్మూర్తిశ్చతుర్బాహుశ్చతుర్వ్యూహశ్చతుర్గతిః |\n
    చతురాత్మా చతుర్భావశ్చతుర్వేదవిదేకపాత్ || ౮౨ ||
  83:
    సమావర్తోఽనివృత్తాత్మా దుర్జయో దురతిక్రమః |\n
    దుర్లభో దుర్గమో దుర్గో దురావాసో దురారిహా || ౮౩ ||
  84:
    శుభాంగో లోకసారంగస్సుతంతుస్తంతువర్ధనః |\n
    ఇంద్రకర్మా మహాకర్మా కృతకర్మా కృతాగమః || ౮౪ ||
  85:
    ఉద్భవస్సుందరస్సుందో రత్ననాభస్సులోచనః |\n
    అర్కో వాజసనశ్శృంగీ జయంతస్సర్వవిజ్జయీ || ౮౫ ||
  86:
    సువర్ణబిందురక్షోభ్యస్సర్వవాగీశ్వరేశ్వరః |\n
    మహాహ్రదో మహాగర్తో మహాభూతో మహానిధిః || ౮౬ ||
  87:
    కుముదః కుందరః కుందః పర్జన్యః పావనోఽనిలః |\n
    అమృతాంశోఽమృతవపుస్సర్వజ్ఞస్సర్వతోముఖః || ౮౭ ||
  88:
    సులభస్సువ్రతస్సిద్ధః శత్రుజిచ్ఛత్రుతాపనః |\n
    న్యగ్రోధోదుంబరోఽశ్వత్థశ్చాణూరాంధ్రనిషూదనః || ౮౮ ||
  89:
    సహస్రార్చిస్సప్తజిహ్వస్సప్తైధాస్సప్తవాహనః |\n
    అమూర్తిరనఘోఽచిన్త్యో భయకృద్భయనాశనః || ౮౯ ||
  90:
    అణుర్బృహత్కృశః స్థూలో గుణభృన్నిర్గుణో మహాన్ |\n
    అధృతః స్వధృతస్స్వాస్థ్యః ప్రాగ్వంశో వంశవర్ధనః || ౯౦ ||
  91:
    భారభృత్కథితో యోగీ యోగీశస్సర్వకామదః |\n
    ఆశ్రమః శ్రమణః క్షామః సుపర్ణో వాయువాహనః || ౯౧ ||
  92:
    ధనుర్ధరో ధనుర్వేదో దండో దమయితా దమః |\n
    అపరాజితస్సర్వసహో నియంతా నియమో యమః || ౯౨ ||
  93:
    సత్త్వవాన్ సాత్త్వికస్సత్యస్సత్యధర్మపరాయణః |\n
    అభిప్రాయః ప్రియార్హోఽర్హః ప్రియకృత్ప్రీతివర్ధనః || ౯౩ ||
  94:
    విహాయసగతిర్జ్యోతిస్సురుచిర్హుతభుగ్విభుః |\n
    రవిర్విలోచనస్సూర్యస్సవితా రవిలోచనః || ౯౪ ||
  95:
    అనంతో హుతభుగ్భోక్తా సుఖదో నైకజోఽగ్రజః |\n
    అనిర్విణ్ణస్సదామర్షీ లోకాధిష్ఠానమద్భుతః || ౯౫ ||
  96:
    సనాత్సనాతనతమః కపిలః కపిరవ్యయః |\n
    స్వస్తిదస్స్వస్తికృత్స్వస్తి స్వస్తిభుక్స్వస్తిదక్షిణః || ౯౬ ||
  97:
    అరౌద్రః కుండలీ చక్రీ విక్రమ్యూర్జితశాసనః |\n
    శబ్దాతిగశ్శబ్దసహః శిశిరశ్శర్వరీకరః || ౯౭ ||
  98:
    అక్రూరః పేశలో దక్షో దక్షిణః క్షమిణాం‍వరః |\n
    విద్వత్తమో వీతభయః పుణ్యశ్రవణకీర్తనః || ౯౮ ||
  99:
    ఉత్తారణో దుష్కృతిహా పుణ్యో దుస్స్వప్ననాశనః |\n
    వీరహా రక్షణస్సన్తో జీవనం పర్యవస్థితః || ౯౯ ||
  100:
    అనంతరూపోఽనంతశ్రీర్జితమన్యుర్భయాపహః |\n
    చతురశ్రో గభీరాత్మా విదిశో వ్యాదిశో దిశః || ౧౦౦ ||
  101:
    అనాదిర్భూర్భువో లక్ష్మీస్సువీరో రుచిరాంగదః |\n
    జననో జనజన్మాదిర్భీమో భీమపరాక్రమః || ౧౦౧ ||
  102:
    ఆధారనిలయో ధాతా పుష్పహాసః ప్రజాగరః |\n
    ఊర్ధ్వగస్సత్పథాచారః ప్రాణదః ప్రణవః పణః || ౧౦౨ ||
  103:
    ప్రమాణం ప్రాణనిలయః ప్రాణభృత్ప్రాణజీవనః |\n
    తత్త్వం తత్త్వవిదేకాత్మా జన్మమృత్యుజరాతిగః || ౧౦౩ ||
  104:
    భూర్భువస్స్వస్తరుస్తారస్సవితా ప్రపితామహః |\n
    యజ్ఞో యజ్ఞపతిర్యజ్వా యజ్ఞాంగో యజ్ఞవాహనః || ౧౦౪ ||
  105:
    యజ్ఞభృద్యజ్ఞకృద్యజ్ఞీ యజ్ఞభుగ్యజ్ఞసాధనః |\n
    యజ్ఞాన్తకృద్యజ్ఞగుహ్యమన్నమన్నాద ఏవ చ || ౧౦౫ ||
  106:
    ఆత్మయోనిస్స్వయంజాతో వైఖానస్సామగాయనః |\n
    దేవకీనందనస్స్రష్టా క్షితీశః పాపనాశనః || ౧౦౬ ||
  107:
    శంఖభృన్నందకీ చక్రీ శార్‍ఙ్గధన్వా గదాధరః |\n
    రథాంగపాణిరక్షోభ్యస్సర్వప్రహరణాయుధః || ౧౦౭ ||\n
    శ్రీసర్వప్రహరణాయుధ ఓం నమ ఇతి |
  108:
    వనమాలీ గదీ శార్‍ఙ్గీ శంఖీ చక్రీ చ నందకీ |\n
    శ్రీమాన్నారాయణో విష్ణుర్వాసుదేవోఽభిరక్షతు || ౧౦౮ ||\n
    [** శ్రీ వాసుదేవోఽభిరక్షతు ఓం నమ ఇతి | **]

phalasruti:
  1:
    శ్రీ భీష్మ ఉవాచ |\n
    ఇతీదం కీర్తనీయస్య కేశవస్య మహాత్మనః |\n
    నామ్నాం సహస్రం దివ్యానామశేషేణ ప్రకీర్తితమ్ || ౧ ||
  2:
    య ఇదం శృణుయాన్నిత్యం యశ్చాపి పరికీర్తయేత్ |\n
    నాఽశుభం ప్రాప్నుయాత్కించిత్సోఽముత్రేహ చ మానవః || ౨ ||
  3:
    వేదాంతగో బ్రాహ్మణస్స్యాత్ క్షత్రియో విజయీ భవేత్ |\n
    వైశ్యో ధనసమృద్ధస్స్యాచ్ఛూద్రస్సుఖమవాప్నుయాత్ || ౩ ||
  4:
    ధర్మార్థీ ప్రాప్నుయాద్ధర్మమర్థార్థీ చార్థమాప్నుయాత్ |\n
    కామానవాప్నుయాత్కామీ ప్రజార్థీ చాప్నుయాత్ప్రజాః || ౪ ||
  5:
    భక్తిమాన్ యస్సదోత్థాయ శుచిస్తద్గతమానసః |\n
    సహస్రం వాసుదేవస్య నామ్నామేతత్ప్రకీర్తయేత్ || ౫ ||
  6:
    యశః ప్రాప్నోతి విపులం యాతి ప్రాధాన్యమేవ చ |\n
    అచలాం శ్రియమాప్నోతి శ్రేయః ప్రాప్నోత్యనుత్తమమ్ || ౬ ||
  7:
    న భయం క్వచిదాప్నోతి వీర్యం తేజశ్చ విన్దతి |\n
    భవత్యరోగో ద్యుతిమాన్బలరూపగుణాన్వితః || ౭ ||
  8:
    రోగార్తో ముచ్యతే రోగాద్బద్ధో ముచ్యేత బంధనాత్ |\n
    భయాన్ముచ్యేత భీతస్తు ముచ్యేతాపన్న ఆపదః || ౮ ||
  9:
    దుర్గాణ్యతితరత్యాశు పురుషః పురుషోత్తమమ్ |\n
    స్తువన్నామసహస్రేణ నిత్యం భక్తిసమన్వితః || ౯ ||
  10:
    వాసుదేవాశ్రయో మర్త్యో వాసుదేవపరాయణః |\n
    సర్వపాపవిశుద్ధాత్మా యాతి బ్రహ్మ సనాతనమ్ || ౧౦ ||
  11:
    న వాసుదేవభక్తానామశుభం విద్యతే క్వచిత్ |\n
    జన్మమృత్యుజరావ్యాధిభయం నైవోపజాయతే || ౧౧ ||
  12:
    ఇమం స్తవమధీయానః శ్రద్ధాభక్తిసమన్వితః |\n
    యుజ్యేతాత్మా సుఖక్షాన్తి శ్రీధృతిస్మృతికీర్తిభిః || ౧౨ ||
  13:
    న క్రోధో న చ మాత్సర్యం న లోభో నాశుభామతిః |\n
    భవన్తి కృత పుణ్యానాం భక్తానాం పురుషోత్తమే || ౧౩ ||
  14:
    ద్యౌస్సచంద్రార్కనక్షత్రం ఖం దిశో భూర్మహోదధిః |\n
    వాసుదేవస్య వీర్యేణ విధృతాని మహాత్మనః || ౧౪ ||
  15:
    స సురాసురగంధర్వం సయక్షోరగరాక్షసమ్ |\n
    జగద్వశే వర్తతేదం కృష్ణస్య సచరాచరమ్ || ౧౫ ||
  16:
    ఇంద్రియాణి మనో బుద్ధిస్సత్త్వం తేజో బలం ధృతిః |\n
    వాసుదేవాత్మకాన్యాహుః క్షేత్రం క్షేత్రజ్ఞ ఏవ చ || ౧౬ ||
  17:
    సర్వాగమానామాచారః ప్రథమం పరికల్పితః |\n
    ఆచారప్రభవో ధర్మో ధర్మస్య ప్రభురచ్యుతః || ౧౭ ||
  18:
    ఋషయః పితరో దేవా మహాభూతాని ధాతవః |\n
    జంగమాజంగమం చేదం జగన్నారాయణోద్భవమ్ || ౧౮ ||
  19:
    యోగో జ్ఞానం తథా సాంఖ్యం విద్యాశ్శిల్పాది కర్మ చ |\n
    వేదాశ్శాస్త్రాణి విజ్ఞానమేతత్సర్వం జనార్దనాత్ || ౧౯ ||
  20:
    ఏకో విష్ణుర్మహద్భూతం పృథగ్భూతాన్యనేకశః |\n
    త్రీన్లోకాన్వ్యాప్య భూతాత్మా భుంక్తే విశ్వభుగవ్యయః || ౨౦ ||
  21:
    ఇమం స్తవం భగవతో విష్ణోర్వ్యాసేన కీర్తితమ్ |\n
    పఠేద్య ఇచ్ఛేత్పురుషః శ్రేయః ప్రాప్తుం సుఖాని చ || ౨౧ ||
  22:
    విశ్వేశ్వరమజం దేవం జగతః ప్రభుమవ్యయమ్ |\n
    భజంతి యే పుష్కరాక్షం న తే యాంతి పరాభవమ్ || ౨౨ ||\n
    న తే యాంతి పరాభవమ్ ఓం నమ ఇతి |
  23:
    అర్జున ఉవాచ |\n
    పద్మపత్రవిశాలాక్ష పద్మనాభ సురోత్తమ |\n
    భక్తానామనురక్తానాం త్రాతా భవ జనార్దన || ౨౩ ||
  24:
    శ్రీ భగవానువాచ |\n
    యో మాం నామసహస్రేణ స్తోతుమిచ్ఛతి పాండవ |\n
    సోఽహమేకేన శ్లోకేన స్తుత ఏవ న సంశయః || ౨౪ ||\n
    స్తుత ఏవ న సంశయ ఓం నమ ఇతి |
  25:
    వ్యాస ఉవాచ |\n
    వాసనాద్వాసుదేవస్య వాసితం తే జగత్త్రయమ్ |\n
    సర్వభూతనివాసోఽసి వాసుదేవ నమోఽస్తు తే || ౨౫ ||\n
    శ్రీ వాసుదేవ నమోఽస్తుత ఓం నమ ఇతి |
  26:
    పార్వత్యువాచ |\n
    కేనోపాయేన లఘునా విష్ణోర్నామసహస్రకమ్ |\n
    పఠ్యతే పండితైర్నిత్యం శ్రోతుమిచ్ఛామ్యహం ప్రభో || ౨౬ ||
  27:
    ఈశ్వర ఉవాచ |\n
    శ్రీరామ రామ రామేతి రమే రామే మనోరమే |\n
    సహస్రనామ తత్తుల్యం రామ నామ వరాననే || ౨౭ ||\n
    శ్రీరామనామ వరానన ఓం నమ ఇతి |
  28:
    బ్రహ్మోవాచ |\n
    నమోఽస్త్వనంతాయ సహస్రమూర్తయే\n
    సహస్రపాదాక్షిశిరోరుబాహవే |\n
    సహస్రనామ్నే పురుషాయ శాశ్వతే\n
    సహస్రకోటీయుగధారిణే నమః || ౨౮ ||\n
    సహస్రకోటీయుగధారిణే ఓం నమ ఇతి |
  29:
    సంజయ ఉవాచ |\n
    యత్ర యోగేశ్వరః కృష్ణో యత్ర పార్థో ధనుర్ధరః |\n
    తత్ర శ్రీర్విజయో భూతిర్ధ్రువా నీతిర్మతిర్మమ || ౨౯ ||
  30:
    శ్రీ భగవానువాచ |\n
    అనన్యాశ్చింతయంతో మాం యే జనాః పర్యుపాసతే |\n
    తేషాం నిత్యాభియుక్తానాం యోగక్షేమం వహామ్యహమ్ || ౩౦ ||
  31:
    పరిత్రాణాయ సాధూనాం వినాశాయ చ దుష్కృతామ్ |\n
    ధర్మసంస్థాపనార్థాయ సంభవామి యుగే యుగే || ౩౧ ||
  32:
    ఆర్తా విషణ్ణాశ్శిథిలాశ్చ భీతాః\n
    ఘోరేషు చ వ్యాధిషు వర్తమానాః |\n
    సంకీర్త్య నారాయణశబ్దమాత్రం\n
    విముక్తదుఃఖాస్సుఖినో భవంతి || ౩౨ ||
  33:
    కాయేన వాచా మనసేంద్రియైర్వా\n
    బుద్ధ్యాత్మనా వా ప్రకృతేస్స్వభావాత్ |\n
    కరోమి యద్యత్సకలం పరస్మై\n
    నారాయణాయేతి సమర్పయామి || ౩౩ ||
  34:
    యదక్షర పదభ్రష్టం మాత్రాహీనం తు యద్భవేత్ |\n
    తత్సర్వం క్షమ్యతాం దేవ నారాయణ నమోఽస్తు తే ||\n
    విసర్గ బిందు మాత్రాణి పద పాదాక్షరాణిచ|\n
    న్యూరాని చాతిరిక్తాని క్షమస్వ పురుషోత్తమ||
  35:
    ఇతి శ్రీమహాభారతే శతసహస్రికాయాం సంహితాయాం \n వైయాసిక్యాం అనుశాసనపర్వాంతర్గత అనుశాసనికపర్వణి మోక్షధర్మే\n 
    భీష్మ యుధిష్ఠిర సంవాదే శ్రీ విష్ణోర్దివ్యసహస్రనామస్తోత్రం\n నామ ఏకోనపంచాశదధికశతతమోఽధ్యాయః |\n
    ఇతి శ్రీవిష్ణుసహస్రనామ స్తోత్రమ్ ||
