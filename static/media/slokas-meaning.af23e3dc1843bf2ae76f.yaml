  s1: # 1-9
    namalu:
      విశ్వం, విష్నుః, వషట్కారః, భూతభవ్యభవత్ప్రభుః |\n
      భూతకృద్, భూతభృద్, భావః, భూతాత్మా, భూతభావనః || ౧ ||
    namam-meanings:
      - namam: విశ్వం
        number: 1
        meaning: # can have html to highlight
          సర్వపదార్థాలలో [అన్నింటిలో] ప్రవేశించినవాడు [వుoటాడు] = పరమాత్మ
          అంతటా ప్రవేశించి లోపల, బయట అంతా వ్యాపించి పరిపూర్ణుడైన పరమాత్మ
          [నారాయణుడు] ఉన్నాడు <br />
          పరిపూర్ణుడు → ఏలోపము లేనివాడు, ఐశ్వర్యవంతుడై 6 గుణలు వృండి స్వరూపం,
          రూపం [దివ్వమంగళరూంపం], గుణాలు ఉన్న కౌశల్యం [భేదంలేని వాడు]
          బ్రహ్మ తండ్రి, యశోదకి బిడ్డ, ఈ విష్ణువు
