  s1:
    namalu:
      విశ్వం, విష్నుః, వషట్కారః, భూతభవ్యభవత్ప్రభుః |\n
      భూతకృద్, భూతభృద్, భావః, భూతాత్మా, భూతభావనః || ౧ ||
    namam-meanings: # 1-9
      - namam: విశ్వం
        number: 1
        meaning:
          సర్వపదార్థాలలో [అన్నింటిలో] ప్రవేశించినవాడు [వుoటాడు] = పరమాత్మ
          అంతటా ప్రవేశించి లోపల, బయట అంతా వ్యాపించి పరిపూర్ణుడైన పరమాత్మ
          [నారాయణుడు] ఉన్నాడు.
          పరిపుయడు→ ఏలోపము లేనివాడు, ఐశ్వర్యవంతుడై 6 గుణలు వృండి స్వరూపం,
          రూపం [దివ్వమంగళరూంపం], గుణాలు ఉన్న కాశల్యం [భేదంలేని వాడు]
          బ్రహ్మ తండ్రి, యశోదకి బిడ్డ, ఈ విష్ణువు
      - namam: విష్నుః
        number: 2
        meaning:
          విష్నుః meaning
      - namam: వషట్కారః
        number: 3
        meaning:
          వషట్కారః meaning
      - namam: భూతభవ్యభవత్ప్రభుః
        number: 4
        meaning:
          భూతభవ్యభవత్ప్రభుః meaning
  s2:
    namalu:
      పూతాత్మా, పరమాత్మ, ముక్తానాం పరమాగతిః |\n
      అవ్యయః, పురుషః, స్సాక్షీ, క్షేత్రజ్ఞః, అక్షర || ౨ ||
    namam-meanings: # 10-17
      - namam: పూతాత్మా
        number: 10
        meaning: పూతాత్మా meaning
      - namam: పరమాత్మ
        number: 11
        meaning: పరమాత్మ meaning
      - namam: ముక్తానాం పరమాగతిః
        number: 12
        meaning: ముక్తానాం పరమాగతిః meaning
