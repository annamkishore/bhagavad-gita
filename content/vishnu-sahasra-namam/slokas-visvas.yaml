title:
  శ్రీ విష్ణు సహస్రనామ స్తోత్రం

poorvangam:
  start-line:
    హరిః ఓమ్
    శ్రీ విష్ణు సహస్రనామ స్తోత్రం
    పూర్వాంగం
  1:
    2 శుక్లామ్బరధరం విష్ణుం శశివర్ణం చతుర్భుజమ్.. |<br />
    2 ప్రసన్నవదనం ధ్యాయేత్ సర్వవిఘ్నోపశాంతయే ||
  2:
    0 యస్య ద్విరదవక్త్రాద్యాఫ్ పారిషద్యాఫ్ పరశ్ శతమ్ |<br />
    2 విఘ్నం నిఘ్నన్తి సతతం విష్వక్సేనం తమాశ్రయే ||
  3:
    1 వ్యాసం వసిష్ఠ నప్తారం శక్తేఫ్ పౌత్రమకల్మషమ్.. |<br />
    1 పరాశరాత్మజం వన్దే శుకతాతం తపోనిధిమ్.. ||
  4:
    0 వ్యాసాయ విష్ణు రూపాయ వ్యాసరూపాయ విష్ణవే |<br />
    2 నమో వై బ్రహ్మనిధయే వాసిష్ఠాయ నమో నమః ||
  5:
    1 అవికారాయ శుద్ధాయ నిత్యాయ పరమాత్మనే |<br />
    0 సదైక రూప రూపాయ విష్ణవే సర్వజిష్ణవే ||
  6:
    1 యస్య స్మరణమాత్రేణ జన్మసంసార బంధనాత్.. |<br />
    1 విముచ్యతే నమస్తస్మై విష్ణవే ప్రభవిష్ణవే ||<br />
    <pre>1    ఓం నమో విష్ణవే ప్రభవిష్ణవే |</pre>
  7:
    0 శ్రీవైశమ్పాయన ఉవాచ |<br />
    1 శ్రుత్వా ధర్మా నశేషేణ పావనాని చ సర్వశః |<br />
    4 యుధిష్ఠిరశ్ శాంతనవం పునరేవాభ్య భాషత ||
  8:
    2 యుధిష్ఠిర ఉవాచ |<br />
    0 కిమేకం దైవతం లోకే? కిం వాఽప్యేకం పరాయణమ్..? |<br />
    1 స్తువన్తః కం? కమర్చన్తఫ్ ప్రాప్నుయుర్మానవాశ్ శుభమ్..? ||
  9:
    3 కో ధర్మః సర్వధర్మాణాం భవతఫ్ పరమో మతః? |<br />
    1 కిం జపన్ముచ్యతే జన్తుర్ జన్మ సంసార బన్ధనాత్..? ||
  10:
    1 శ్రీ భీష్మ ఉవాచ |<br />
    1 జగత్ప్రభుం దేవదేవమ్ అనన్తం పురుషోత్తమమ్.. |<br />
    1 స్తువన్నామ సహస్రేణ పురుషస్ సతతోత్థితః ||
  11:
    1 తమేవ చార్చయన్నిత్యం భక్త్యా పురుష మవ్యయమ్ |<br />
    1 ధ్యాయన్ స్తువన్ నమస్యంశ్చ యజమానస్తమేవ చ ||
  12:
    1 అనాది నిధనం విష్ణుం సర్వలోక మహేశ్వరమ్.. |<br />
    3 లోకాధ్యక్షం స్తువన్నిత్యం సర్వ దుఃఖాతిగో భవేత్.. ||
  13:
    2 బ్రహ్మణ్యం సర్వధర్మజ్ఞం లోకానాం కీర్తివర్ధనమ్.. |<br />
    5 లోకనాథం మహద్భూతం సర్వభూత భవోద్భవమ్.. ||
  14:
    3 ఏష మే సర్వధర్మాణాం ధర్మోఽధికతమో మతః |<br />
    1 యద్భక్త్యా పుండరీకాక్షం స్తవైరర్చేన్నరస్ సదా ||
  15:
    0 పరమం యో మహత్తేజఫ్ పరమం యో మహత్తపః |<br />
    0 పరమం యో మహద్బ్రహ్మ పరమం యఫ్ పరాయణమ్ ||
  16:
    0 పవిత్రాణాం పవిత్రం యో మఙ్గళానాం చ మఙ్గళమ్ |<br />
    1 దైవతం దైవతానాం చ భూతానాం యోఽవ్యయఫ్ పితా ||
  17:
    2 యతః సర్వాణి భూతాని భవన్త్యాది యుగాగమే |<br />
    0 యస్మింశ్చ ప్రలయం యాన్తి పునరేవ యుగక్షయే ||
  18:
    3 తస్య లోక ప్రధానస్య జగన్నాథస్య భూపతే |<br />
    1 విష్ణోర్నామసహస్రం మే శృణు పాపభయాపహమ్.. ||
  19:
    1 యాని నామాని గౌణాని విఖ్యాతాని మహాత్మనః |<br />
    2 ఋషిభిఫ్ పరిగీతాని తాని వక్ష్యామి భూతయే ||
  20:
    0 ఋషిర్నామ్నాం సహస్రస్య వేదవ్యాసో మహామునిః |<br />
    3 ఛన్దోఽనుష్టుప్ తథా దేవో భగవాన్ దేవకీసుతః ||
  21:
    1 అమృతాంశూద్భవో బీజం శక్తిర్దేవకినందనః |<br />
    1 త్రిసామా హృదయం తస్య శాన్త్యర్థే వినియుజ్యతే ||
  22:
    1 విష్ణుం జిష్ణుం మహావిష్ణుం ప్రభవిష్ణుం మహేశ్వరమ్ |<br />
    0 అనేకరూప దైత్యాన్తం నమామి పురుషోత్తమమ్.. ||

poorvanyasaha:
  <br/>
  ఓం అస్య శ్రీవిష్ణోర్దివ్యసహస్రనామస్తోత్ర మహామన్త్రస్య |<br />
  శ్రీ వేదవ్యాసో భగవాన్ ఋషిః| అనుష్టుప్ ఛన్దః|<br />
  శ్రీమహావిష్ణుఫ్ పరమాత్మా శ్రీమన్నారాయణో దేవతా|<br />
  అమృతాంశూద్భవో భానురితి బీజమ్..|<br/> 
  దేవకీ నందనస్ స్రష్టేతి శక్తిః|<br />
  ఉద్భవః క్షోభణో దేవ ఇతి పరమోమన్త్రః|<br />
  శఙ్ఖభృన్నన్దకీ చక్రీతి కీలకమ్..| శార్ ఙ్గధన్వాగదాధర ఇత్యస్త్రమ్..|<br />
  రథాఙ్గపాణిరక్షోభ్య ఇతి నేత్రమ్..| త్రిసామాసామగస్ సామేతి కవచమ్..|<br />
  ఆనన్దం పరబ్రహ్మే యోనిః|<br />
  ఋతుస్ సుదర్శనః కాల ఇతి దిగ్బన్ధః| <br/>
  శ్రీ విశ్వరూప ఇతి ధ్యానమ్..|<br />
  శ్రీమహావిష్ణు ప్రీత్యర్థే సహస్రనామ జపే వినియోగః ||<br />
  <br/>

dhyaanam:
  start-line:
    ధ్యానమ్ |
  1:
    క్షీరోదన్వత్ ప్రదేశే శుచిమణి విలసత్ సైకతే మౌక్తికానాం<br />
    మాలాక్లుప్తాసనస్థస్ స్ఫటిక మణి నిభైర్ మౌక్తికైర్మణ్డితాఙ్గః |<br />
    శుభ్రై రభ్రై రదభ్రై రుపరివిరచితైర్ముక్త పీయూషవర్షైః <br />
    ఆనన్దీ నఫ్ పునీయా దరినళిన గదాశఙ్ఖ పాణిర్ముకున్దః || ౧ ||
  2:
    భూః పాదౌ యస్య నాభిర్వియదసురనిలశ్చంద్ర సూర్యౌ చ నేత్రే<br />
    కర్ణావాసాః శిరో ద్యౌర్ముఖమపి దహనో యస్య వాస్తేయమబ్ధిః |<br />
    అంతఃస్థం యస్య విశ్వం సురనరఖగగోభోగిగంధర్వదైత్యైః<br />
    చిత్రం రంరమ్యతే తం త్రిభువనవపుషం విష్ణుమీశం నమామి || ౨ ||
  3:
    శాంతాకారం భుజగశయనం పద్మనాభం సురేశం<br />
    విశ్వాకారం గగనసదృశం మేఘవర్ణం శుభాంగమ్ |<br />
    లక్ష్మీకాంతం కమలనయనం యోగిహృద్ధ్యానగమ్యం<br />
    వందే విష్ణుం భవభయహరం సర్వలోకైకనాథమ్ || ౩ ||
  4:
    మేఘశ్యామం పీతకౌశేయవాసం<br />
    శ్రీవత్సాంకం కౌస్తుభోద్భాసితాంగమ్ |<br />
    పుణ్యోపేతం పుండరీకాయతాక్షం<br />
    విష్ణుం వందే సర్వలోకైకనాథమ్ || ౪ ||
  5:
    నమః సమస్తభూతానామాదిభూతాయ భూభృతే |<br />
    అనేకరూపరూపాయ విష్ణవే ప్రభవిష్ణవే || ౫ ||
  6:
    సశంఖచక్రం సకిరీటకుండలం<br />
    సపీతవస్త్రం సరసీరుహేక్షణమ్ |<br />
    సహారవక్షఃస్థలశోభికౌస్తుభం<br />
    నమామి విష్ణుం శిరసా చతుర్భుజమ్ || ౬ ||
  7:
    ఛాయాయాం పారిజాతస్య హేమసింహాసనోపరి<br />
    ఆసీనమంబుదశ్యామమాయతాక్షమలంకృతమ్ |<br />
    చంద్రాననం చతుర్బాహుం శ్రీవత్సాంకిత వక్షసం<br />
    రుక్మిణీ సత్యభామాభ్యాం సహితం కృష్ణమాశ్రయే || ౭ ||

maha-mantram:
  start-line:
    హరిః ఓం - ఓమ్ విశ్వస్మై నమః (మహామంత్రం)
  1:
    4 విశ్వం విష్ణుర్ వషట్కారో భూత భవ్య భవత్ ప్రభుః | <br />
    7 భూతకృద్ భూతభృద్ భావో భూతాత్మా భూతభావనః ||
    <span class="text-sm">(1-9)</span>
  2:
    0 పూతాత్మా పరమాత్మా చ ముక్తానాం పరమాగతిః | <br />
    0 అవ్యయఫ్ పురుషస్ సాక్షీ క్షేత్రజ్ఞోఽక్షర ఏవ చ ||
    <span class="text-sm">(10-17)</span>
  3:
    1 యోగో యోగవిదాంనేతా ప్రధాన పురుషేశ్వరః |<br />
    0 నారసింహవపుశ్ శ్రీమాన్ కేశవఫ్ పురుషోత్తమః ||
    <span class="text-sm">(18-24)</span>
  4:
    3 సర్వశ్ శర్వశ్ శివస్ స్థాణుర్ భూతాదిర్ నిధిరవ్యయః |<br />
    5 సమ్భవో భావనోభర్తా ప్రభవఫ్ ప్రభురీశ్వరః ||
    <span class="text-sm">(25-36)</span>
  5:
    2 స్వయమ్భూశ్ శమ్భురాదిత్యఫ్ పుష్కరాక్షో మహాస్వనః |<br />
    4 అనాదినిధనో ధాతా విధాతా ధాతురుత్తమః ||
    <span class="text-sm">(37-45)</span>
  6:
    2 అప్రమేయో హృషీకేశఫ్ పద్మనాభోఽమరప్రభుః |<br />
    4 విశ్వకర్మా మనుస్త్వష్టా స్థవిష్ఠస్ స్థవిరోధ్రువః ||<br />
    <span class="text-sm">(శంకర భాష్యం 46-54; పరాశర భట్టర్ భాష్యం 46-55)</span>
  7:
    0 అగ్రాహ్యశ్ శాశ్వతః కృష్ణో లోహితాక్షఫ్ ప్రతర్దనః |<br />
    2 ప్రభూతస్ త్రికకుబ్ధామ* పవిత్రం మఙ్గళం పరమ్.. ||<br />
    <span class="text-sm">* త్రికకుబ్ధామ – ఇలా కూడా చదవవచ్చు (55-63; 56-64)</span>
  8:
    2 ఈశానఫ్ ప్రాణదఫ్ ప్రాణో జ్యేష్ఠశ్ శ్రేష్ఠఫ్ ప్రజాపతిః |<br />
    5 హిరణ్యగర్భో భూగర్భో మాధవో మధుసూదనః ||<br />
    <span class="text-sm">(64-73; 65-74)</span>
  9:
    2 ఈశ్వరో విక్రమీధన్వీ మేధావీ విక్రమః క్రమః |<br />
    1 అనుత్తమో దురాధర్షః కృతజ్ఞః కృతిరాత్మవాన్.. ||<br />
    <span class="text-sm">(74-84; 75-85)
  10:
    1 సురేశశ్ శరణం శర్మ విశ్వరేతాఫ్ ప్రజాభవః |<br />
    0 అహస్ సంవత్సరో వ్యాలఫ్ ప్రత్యయస్ సర్వదర్శనః ||<br />
