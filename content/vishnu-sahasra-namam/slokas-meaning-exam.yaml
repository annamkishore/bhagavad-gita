  s1: # 1-9
    namalu:
      విశ్వం, విష్నుః, వషట్కారః, భూతభవ్యభవత్ప్రభుః |\n
      భూతకృద్, భూతభృద్, భావః, భూతాత్మా, భూతభావనః || ౧ ||
    namam-meanings:
      - namam: విశ్వం
        number: 1
        meaning: > # can have html to highlight
          సర్వ పదార్ధములలో, అన్ని గుణాలతో, పూర్ణముగా ప్రవేశించిన వాడు. పరిపూర్ణుడు. పరమాత్మ=నారాయణుడు
          <div style='padding-left: 2rem'>
          1. శ్రీవైకుంఠములో,  
          <br /> 2. పాల కడలిలో, 
          <br /> 3. అవతరములలో, 
          <br /> 4. ప్రతి జీవిలో అంతర్యామి గాను, 
          <br /> 5. విగ్రహ రుపములో దేవాలయాలలోను ఉంటాడు. అర్చావతారములో
          </div>
      - namam: విష్ణుః
        number: 2
        meaning: సర్వత్ర (అంతటా) వ్యాపించి ఉన్నవాడు.
      - namam: వషట్కారః
        number: 3
        meaning: సర్వమును తన వశములో ఉంచుకున్నవాడు.
      - namam: భూత భవ్య భవత్ ప్రభుః
        number: 4
        meaning: మూడు(భూత, భవిష్యత్, వర్తమాన) కాలములలో ఉండు అన్ని నిత్య(life), అనిత్య(body) పదార్ధములకు, అందరికీ ఆయనే స్వామి.
      - namam:        # for next line
      - namam: భూతకృత్
        number: 5
        meaning: సర్వ భూతములను స్వతంత్రుడై సృష్టించిన వాడు. భూతములు-చేతన(జీవులు),అచేతనములు (చెట్లు మొదలైనవి) జీవులు -బద్ధులు - సంసారములో ఉండేవాళ్లు; -ముక్తులు-మోక్షము పొందిన వాళ్ళు; -నిత్యులు -సంసారములో పడనివారు. ఎప్పుడు వైకుంఠములో ఉండువారు. ఆదిశేషుడు, గరుక్మంతుడు.
      - namam: భూతభృద్ః
        number: 6
        meaning: సర్వ ప్రాణులను(పంచ భూతాలతో తయారైన) అన్ని జీవులను పోషించువాడు.
      - namam: భావః
        number: 7
        meaning: తన అన్ని విభూతు(సంపద)లతో కూడి ప్రకాశించువాడు. విశ్వము- లీలా విభూతి; వైకుంఠము- నిత్య విభూతి. నెమలి వలె సూక్ష్మ స్థూల రూపాలలో ప్రకాశించువాడు. (నెమలి పింఛము ముడుచుట, ఒక్కసారిగా విప్పుట వలె) అన్ని అభిప్రాయములు తానే అయినవాడు.
      - namam: భూతాత్మ
        number: 8
        meaning: సమస్త భూతములకు ఆత్మ అయిన వాడు.
      - namam: భూతభావనః
        number: 9
        meaning: సమస్త భూతములను భావించినంత మాత్రముననే ప్రాణులను సృష్టించి, లయింపజేసేవాడు.
  s2: # 10-17
    namalu:
      పూతాత్మ, పరమాత్మ, ముక్తానాం పరమాగతిః |\n
      అవ్యయః, పురుషః, స్సాక్షీ, క్షేత్రజ్ఞః, అక్షర || ౨ ||
    namam-meanings:
      - namam: పూతాత్మ
        number: 10
        meaning: పవిత్రమైన ఆత్మ కలవాడు. పాపాలు అంటవు.
      - namam: పరమాత్మ చ
        number: 11
        meaning: మిక్కిలి ఉత్తమమైన ఆత్మ కలవాడు. తన కంటే మించిన వేరొక ఆత్మ లేనివాడు.
      - namam: ముక్తానాం పరమాగతిః
        number: 12
        meaning: మోక్షము (ఈ బంధము పోవాలని) కోరుకునే వారికి శ్రేష్ఠమైన దిక్కు అయిన వాడు. ఉత్తమగతి ఇచ్చువాడు. అయిన మోక్షాన్ని, పరమానందాన్ని
      - namam:
      - namam: అవ్యయః
        number: 13
        meaning: వ్యయము కానివాడు. ముక్తితో ఎవరిని పొందిన మరల దూరమగుట సంభవింపదో అట్టివాడు.
      - namam: పురుషః
        number: 14
        meaning: అధికముగా అన్ని ఫలములు ఇచ్చువాడు.
      - namam: సాక్షీ
        number: 15
        meaning: తనను చేరిన వారిని ఆనందింప చేయుచూ, వారిని చూచి తాను కూడా ఆనందించేవాడు.
      - namam: క్షేత్రజ్ఞః
        number: 16
        meaning: దివ్య క్షేత్రమైన పరమ పదమును గుర్తించిన వాడు. శ్రీవైకుంఠము చేరిన ముక్తులకు తనను అనుభవించుటకు (experience) దివ్య శరీరము నిచ్చువాడు.
      - namam: అక్షరః
        number: 17
        meaning: నాశము లేనివాడు. తరగని వాడు. ఏవచ- మరియు.
  s3: # 18-24
    namalu:
      యోగః, యోగవిదాం నేతా, ప్రధానపురుషేశ్వరః |\n
      నారసింహవపుః, శ్రీమాన్, కేశవః, పురుషోత్తమః || ౩ ||
    namam-meanings:
      - namam: యోగః
        number: 18
        meaning: శరణాగతి పొందిన వారికి తనను పొందుటకు తానే సాధనము/ఉపాయము అయిన వాడు.
      - namam: యోగ విదాం నేతా
        number: 19
        meaning: యోగము గురించి బాగా తెలిసినవారికి నాయకుడు. ఉపాసనాది సాధనములు చేయు వారికి అజ్ఞా నము తొలగించి జ్ఞాన దీపము వెలిగించే నాయకుడు.
      - namam: ప్రధాన పురుషేశ్వరః
        number: 20
        meaning: ప్రధానమైన ప్రకృతికి, దానిచే బంధింపబడిన జీవునికి నియామకుడు.
      - namam:
      - namam: నారసింహవపుః
        number: 21
        meaning: నరసింహ శరీర ధారి.
      - namam: శ్రీమాన్
        number: 22
        meaning: అతి మనోహరముగా ప్రకాశించువాడు.
      - namam: కేశవః
        number: 23
        meaning: ఆశ్చర్యమైన కుంతల కేశములు(curly hair) కలవాడు.
      - namam: పురుషోత్తమః
        number: 24
        meaning: సమస్త లోకములలో ఉన్న పురుషుల కంటే గొప్పవాడు. ప్రకృతి కంటే చేతనులు, చేతనుల కంటే ముక్త పురుషులు, వారి కంటే నిత్యులు, నిత్యుల కంటే భగవంతుడు గొప్పవారు.
  s4: # 25-36
    namalu:
      సర్వః, శ్శర్వః, శివః, స్థాణుః, భూతాదిః, నిధిరవ్యయః |\n
      సంభవః, భావనః, భర్తా, ప్రభవః, ప్రభుః, ఈశ్వరః || ౪ ||
    namam-meanings:
      - namam: సర్వ
        number: 25
        meaning: సర్వ జగత్తును తన శరీరము వలె అభిమానించి సర్వత్ర వ్యాపించువాడు.
      - namam: శర్వః
        number: 26
        meaning: తనకు శరీర భూతులైన ప్రాణుల అనిష్టాలను, దుఃఖాలను నశింప జేయువాడు.
      - namam: శివః
        number: 27
        meaning: తన భక్తులకు శుభములను కల్గించువాడు.
      - namam: స్థాణుః
        number: 28
        meaning: భక్తులను అనుగ్రహించుటలో స్థిరముగా నిలుచు వాడు.
      - namam: భూతాదిః
        number: 29
        meaning: సమస్త ప్రాణులచే కోరదగినవాడు.
      - namam: నిధి రవ్యయః
        number: 30
        meaning: నాశము లేని, తరగని నిధి వంటివాడు.
      - namam: సంభవః
        number: 31
        meaning: కోరిన వారాల కొరకు పలు మార్లు అవతరించిన వాడు.( పవిత్రణాయ సాధూనాం ---)
      - namam: భావనః
        number: 32
        meaning:
      - namam: భర్తా
        number: 33
        meaning:
      - namam: ప్రభవః
        number: 34
        meaning:
      - namam: ప్రభుః
        number: 35
        meaning:
      - namam: ఈశ్వరః
        number: 36
        meaning:
  s5: # 37-45
    namalu:
      స్వయంభూః, శంభుః, ఆదిత్యః, పుష్కరాక్షః, మహాస్వనః |\n
      అనాదినిధనః, ధాతా, విధాతా, ధాతురుత్తమః || ౫ ||
    namam-meanings:
      - namam: స్వయంభూః
        number: 37
        meaning: తనంతట తానుగా అవతరించిన వాడు.
      - namam: శంభుః
        number: 38
        meaning: సుఖమును ఇచ్చువాడు. శం=సుఖము; భు= ఇచ్చువాడు .
      - namam: ఆదిత్యః
        number: 39
        meaning: సూర్య మండలము నివాసముగా కలవాడు.
      - namam: పుష్కరాక్ష
        number: 40
        meaning: పద్మ నేత్రములు కలవాడు. పత్రముల వలె విశాలమైన
      - namam: మహాస్వనః
        number: 41
        meaning: గొప్పదైన వేద శబ్దము (యదార్ధ జ్ఞానము) ప్రమాణముగా కలవాడు.
      - namam:
      - namam: అనాది నిధనః
        number: 42
        meaning: మొదలు, నాశనము లేనివాడు. ఆది అంతములు, లేనివాడు. జరామరణము దుఃఖములు
      - namam: ధాతా
        number: 43
        meaning: సమస్త ప్రపంచమునకు మూల కారణమైన వాడు.
      - namam: విధాతా
        number: 44
        meaning: కర్మ ఫలములను అందించువాడు. ఛతుర్ముఖ బ్రహ్మను జన్మింపజేసినవాడు.
      - namam: ధాతురుత్తమః
        number: 45
        meaning: బ్రహ్మ కంటే ఉత్తముడు/శ్రేష్ఠుడు.
