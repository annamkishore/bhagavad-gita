    namam-meanings:
      - namam: అసంఖ్యేయః
        number: 248
        meaning: సంఖ్యను మించిన నరసమూహములు కలవారు
      - namam: అప్రమేయాత్మ
        number: 249
        meaning: అసంఖ్యేయములైన చేతనా, అచేతనములంతటా అమితంగా వ్యాపించినటువంటి అమితమైన రూపము కలవాడు
      - namam: విశిష్టః
        number: 250
        meaning: చేతనా, అచేతనముల కంటే స్వయముగానే అధికమైనవాడు
      - namam: శిష్టకృత్
        number: 251
        meaning: మంచిని చేయువాడు తన సంబంధం చేత వాటిని మంగళప్రదముగా చేయువాడు
      - namam: శుచిః
        number: 252
        meaning: స్వయం ప్రకాశమై వెలుగొందువాడు
      - namam:
      - namam: సిద్ధార్థః
        number: 253
        meaning: అన్ని పదార్థములు స్వాధీనముగా కలవాడు, సకలం సిద్ధించినవాడు
      - namam: సిద్ధసంకల్పః
        number: 254
        meaning: తన సంకల్పము చేత సర్వమూ సిద్ధించినవాడు 
          సత్యకామః = ఆయన నెరవేరిన కోరికలు కలవాడు 
          సత్యసంకల్పః = సత్యమైన ప్రతిజ్ఞ చేసినవాడు 
          6 గుణాలు/ అష్ట గుణాలు
          అపహతప్రాప్తాః = [నెరవేరిన కోరికలు కలవాడు]దోషములు లేనివాడు
          విమృత్యుః = మృత్యులేనివాడు
          విజరః = ముసలితనం లేని వాడు
          విశోకః =  సోకం లేనివాడు
          విధి విప్యాస్చః = ఆకలి లేనివాడు
          ఆపిపాశః = దాహం లేని వాడు
      - namam: స్సిద్ధిద
        number: 255
        meaning: అణిమ, గరిమ మొదలగు అష్టసిద్ధులను తనను ఉపాసించిన వారికి ఇచ్చువాడు
          అష్టసిద్ధులు
          అణిమ = ఆతి సూక్ష్మ రూపమును పొందుట
          మహిమ = అతి విశాలమైన రూపము
          గరిమ = మిక్కిలి బరువు కలిగి ఉండుట
          లాఘిమ = మిక్కిలి చులకన అయి ఉండుట
          ప్రాప్తి = కోరిన దానిని తక్షణమే పొందగలుగుతా
          ప్రాకామ్యం = స్వేచ్ఛగా ఏఏ లోకములకైనా వెళ్లి సంచరించుట
          ఈశత్వం = అందరిని నియమించగలుగుతా
          వసిత్వం = ఇంద్రియ నిగ్రహము కలుగుట
      - namam: సిద్ధిసాధనః
        number: 256
        meaning: సిద్ధి రూపమును సాధనముగా కలవాడు
